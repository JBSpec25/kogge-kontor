

<script>
window.KK_BUILD = '@@BUILD@@';
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// Hinweis auf neue Version, wenn die App lange im Hintergrund offen war
(() => {
  let shown = false, last = 0;
  async function check() {
    if (shown || location.protocol !== 'https:' || Date.now() - last < 60000) return;
    last = Date.now();
    try {
      const v = (await (await fetch('version.txt?' + Date.now(), {cache:'no-store'})).text()).trim();
      if (v && v !== window.KK_BUILD) show();
    } catch (e) {}
  }
  function show() {
    shown = true;
    const b = document.createElement('div');
    b.setAttribute('role', 'status');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#1b2830;color:#eef2ef;border-radius:12px;padding:10px 12px 10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font:15px/1.3 "Alegreya Sans",sans-serif';
    b.innerHTML = '<span>@@NEU@@</span><button type="button" style="flex:none;min-height:40px;border:0;border-radius:8px;background:#dba64b;color:#1b1306;font:600 14px \'IBM Plex Mono\',monospace;padding:0 12px;cursor:pointer">@@LADEN@@</button>';
    b.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(b);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(check, 30 * 60000);
  setTimeout(check, 15000);
})();
</script>
