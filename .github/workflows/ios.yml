# Baut die iPhone-App auf einem Mac von GitHub und lädt sie zu TestFlight hoch.
# Geheimnisse (Repository → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Team-ID aus developer.apple.com → Account → Mitgliedschaft
#   ASC_KEY_ID      Schlüssel-ID des App-Store-Connect-API-Schlüssels (Zugriff: Admin)
#   ASC_ISSUER_ID   Issuer-ID von derselben Seite
#   ASC_KEY_P8      Inhalt der Datei AuthKey_XXXX.p8
# Ohne Geheimnisse prüft der Lauf nur, ob die App baut.
name: iPhone-App

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-app
  cancel-in-progress: false

jobs:
  ios:
    # macOS 26 auf Intel: die Arm-Macs von GitHub sind oft ausgelastet und nehmen den Auftrag dann gar nicht an
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pakete
        run: npm ci

      - name: Spiel in die App packen
        run: |
          python3 build_www.py ../src/kogge-kontor.html
          npm run native
          npx cap sync ios

      - name: Xcode
        run: xcodebuild -version

      - name: Bauen ohne Signatur (Prüfung)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: API-Schlüssel ablegen
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archiv mit Signatur
        if: env.HAS_KEY == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 40

      - name: Zu TestFlight hochladen
        if: env.HAS_KEY == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Build ${{ github.run_number }} ist hochgeladen. Nach 10 bis 30 Minuten erscheint er in App Store Connect unter TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Schlüssel löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
